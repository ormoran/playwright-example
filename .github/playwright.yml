name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Pozwala na ręczne uruchomienie testów "on demand" z poziomu zakładki Actions na GitHubie
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest # Tutaj możesz zmienić na 'self-hosted', jeśli używasz własnego dockera

    steps:
    # 1. Pobranie kodu z repozytorium
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Konfiguracja środowiska Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # 3. Instalacja zależności projektu (np. npm install)
    - name: Install dependencies
      run: npm ci

    # 4. Pobieranie przeglądarki Playwright oraz jej systemowych zależności
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 5. Uruchomienie testów Playwright
    - name: Run Playwright tests
      run: npx playwright test

    # 6. Opcjonalnie: Zapisanie raportu HTML z testów jako artefaktu (do pobrania po teście)
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30